[project]
name = "v53-trading-system"
version = "5.3.0-build9"
description = "V5.3 Crypto Trading System — Architecture modulaire prod-safe"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.0,<26.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "websocket-client>=1.8,<2.0",
    "httpx>=0.27",
    # Columnar in-RAM window/feature core (load_silver_table, parquet, ipc) —
    # imported at module load in local_replay_runtime.strategy_ladder_arrow_window;
    # the system does NOT run without it (was previously undeclared).
    "pyarrow>=14.0",
    # Fast C JSON parser — ~2.2x faster trade-silver parse (A2 gold hotspot).
    # Used with a graceful stdlib-json fallback, but declared so production runs
    # get the speedup deterministically.
    "orjson>=3.9",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.6,<5.0",
]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.0",
    "ruff>=0.3.0",
    "mypy>=1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "build1: Build-1 Dependency Architecture",
    "build2: Build-2 Data Backbone",
    "build3: Build-3 Execution Backbone",
    "build4: Build-4 Risk Backbone",
    "build5: Build-5 Scoring Backbone",
    "build6: Build-6 Engine A",
    "smoke: Opt-in subprocess/runtime smoke proofs",
    "slow: Tests lents (shadow/live simulation)",
    "testnet: Binance Spot testnet integration tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
